services:
  jellyfin:
    image: jellyfin/jellyfin:12.4         # official image; minor pinned, so `pull` brings patches but never a major jump
    container_name: jellyfin
    network_mode: host                    # like Plex: TV apps discover it (UDP 7359) and LAN clients are seen with their real IPs
    user: "996:982"                       # "media" user: no login, no sudo, no Docker
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./config:/config                  # database, users, settings
      - ./cache:/cache                    # artwork cache and transcoding temp files
      - /srv/data/media:/data/media:ro    # movies and TV shows, READ-ONLY (same paths as Plex, Radarr, Sonarr, Bazarr)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 3                               # no hardware transcoding on the Pi 5; leaves one core free for AdGuard and the rest
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
