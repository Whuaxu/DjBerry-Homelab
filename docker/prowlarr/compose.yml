# Prowlarr: indexer manager for Radarr.
# Legal indexers only (Internet Archive: public domain / Creative Commons).
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=996                   # "media" user: no login, no sudo, no Docker
      - PGID=982
      - UMASK=002
      - TZ=Europe/Madrid
    volumes:
      - ./config:/config           # settings only; no access to /srv/data needed
    ports:
      - "0.0.0.0:9696:9696"        # web UI, IPv4 only
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
