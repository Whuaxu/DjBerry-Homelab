# WAHA: WhatsApp HTTP API with the GOWS engine (no browser). Bots talk to it over HTTP.
services:
  waha:
    image: devlikeapro/waha:gows-arm-2026.10.1  # ARM64 + GOWS (latest/gows/noweb are amd64 only). Pinned: bump the tag by hand
    container_name: waha
    restart: unless-stopped
    user: "1001:1001"              # your user: the image runs as root unless told otherwise
    env_file:
      - waha.env                   # API key and dashboard passwords (see waha.env.example)
    environment:
      - TZ=Europe/Madrid
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_BASE_URL=http://waha:3000     # file URLs in webhooks, as seen from the Docker network (for the bot)
      - WAHA_API_KEY_EXCLUDE_PATH=ping     # only /ping skips the API key, for the healthcheck
      - WAHA_LOG_FORMAT=PRETTY
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=False        # scan the QR from the dashboard instead
      - WHATSAPP_HOOK_URL=http://bot:3000/webhook  # tell the bot about every incoming message
      - WHATSAPP_HOOK_EVENTS=message.any   # incoming + own messages (own ones only count in the chat with yourself)
    volumes:
      - ./sessions:/app/.sessions  # linked WhatsApp account: lose it and you have to scan the QR again
      - ./media:/app/.media        # received photos and voice notes
    ports:
      - "0.0.0.0:3020:3000"        # dashboard + API, IPv4 only (3000 is taken by AdGuard)
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true

  # The bot: receives WAHA's webhooks and answers through its API. No published
  # ports: only containers on this stack's network can reach it.
  bot:
    build: ./bot
    image: waha-bot:local
    container_name: waha-bot
    restart: unless-stopped
    init: true                     # tini as PID 1: forwards signals, so it stops instantly
    env_file:
      - bot.env                    # WAHA API key and allowed numbers (see bot.env.example)
    environment:
      - TZ=Europe/Madrid
      - WAHA_URL=http://waha:3000
    read_only: true                # stateless: never writes to disk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=true
